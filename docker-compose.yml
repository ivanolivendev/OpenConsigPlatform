services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openconsig}
      POSTGRES_USER: ${POSTGRES_USER:-openconsig}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openconsig_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-openconsig}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-openconsig}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-openconsig_local}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
