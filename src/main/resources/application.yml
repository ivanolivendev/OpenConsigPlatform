spring:
  application:
    name: open-consig-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/openconsig}
    username: ${SPRING_DATASOURCE_USERNAME:openconsig}
    password: ${SPRING_DATASOURCE_PASSWORD:openconsig_local}
  flyway:
    enabled: true
    schemas: platform

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
